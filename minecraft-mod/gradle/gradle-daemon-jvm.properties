# Which JVM Gradle should run its daemon on.
#
# Fabric Loom 1.18.2 resolves onto a JVM 25 runtime, so the build cannot run on
# the Java 21 toolchain the mod compiles against. Declaring the criteria here
# lets Gradle pick JDK 25 by itself - locating an installed one, or downloading
# it via the Foojay resolver configured in settings.gradle - so a plain
# ./gradlew build works without setting JAVA_HOME.
#
# The compiler target stays Java 21 (see build.gradle); this only selects the
# JVM that runs Gradle.
toolchainVersion=25
